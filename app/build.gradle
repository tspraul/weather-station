plugins {
    id 'com.android.application'
}

android {
    namespace 'org.dreamslab.weather'
    compileSdk 34

    defaultConfig {
        applicationId "org.dreamslab.weather"
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv("BUILD_NUMBER") ?: "1")
        versionName "1.0." + (System.getenv("BUILD_NUMBER") ?: "1")
    }

    signingConfigs {
        // A fixed key kept in the repo so every new build installs over the old one
        // without losing the saved weather data.
        weather {
            storeFile file('weather.keystore')
            storePassword 'weatherstation'
            keyAlias 'weather'
            keyPassword 'weatherstation'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.weather
        }
        debug {
            signingConfig signingConfigs.weather
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
