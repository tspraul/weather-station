name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build the APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk weather-station.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest weather-station.apk \
            --title "Weather Station 1.0.${{ github.run_number }}" \
            --notes "Download weather-station.apk on the MAXHUB and open it to install or update."
