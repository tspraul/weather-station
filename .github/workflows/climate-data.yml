name: Climate data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u tools/build_climate.py
        timeout-minutes: 25
      - uses: actions/upload-artifact@v4
        with:
          name: climate
          path: app/src/main/assets/climate.json
