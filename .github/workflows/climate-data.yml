name: Climate data

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u tools/build_city_list.py
      - run: python -u tools/build_climate.py
        timeout-minutes: 60
      - name: Commit the data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app/src/main/assets/climate.js tools/cities_more.csv
          git commit -m "Update climate data" || echo "no change"
          git push
